<div class="barra-filtros-card">
  <!-- 1. Buscador de Marca: carga todas las marcas y permite seleccionar -->
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="input-compacto campo-marca">
    <input
      matInput
      [(ngModel)]="marcaTexto"
      (input)="onMarcaInput()"
      (focus)="filtrarMarcasLocales(marcaTexto)"
      placeholder="Marca"
      [matAutocomplete]="autoMarca"
    />
    <mat-autocomplete #autoMarca="matAutocomplete" (optionSelected)="onMarcaSeleccionada($event)">
      @for (m of marcasFiltradas; track m.idMarca) {
        <mat-option [value]="m.marca">
          {{ m.marca }}
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>

  <!-- 2. Botón [S] y Buscador de Supplier (Proveedores para la marca seleccionada) -->
  <div class="proveedor-container">
    <button type="button" class="btn-s" (click)="toggleProveedor()" title="Selector de Proveedor (Supplier)">S</button>
    <mat-form-field
      appearance="outline"
      subscriptSizing="dynamic"
      class="input-compacto campo-proveedor"
    >
      <input
        matInput
        [(ngModel)]="proveedorTexto"
        (input)="onProveedorInput()"
        (focus)="cargarProveedoresPorMarca(marcaTexto, proveedorTexto)"
        [placeholder]="marcaTexto ? 'Proveedor para ' + marcaTexto : 'Proveedor'"
        [matAutocomplete]="autoProveedor"
      />
      <mat-autocomplete
        #autoProveedor="matAutocomplete"
        (optionSelected)="onProveedorSeleccionado($event)"
      >
        @for (prov of proveedoresFiltrados; track prov.idEntidad) {
          <mat-option [value]="prov">
            <strong>{{ prov.abreviacion }}</strong> - {{ prov.razonSocial }}
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </div>

  <!-- 3. Selector de Clientes (#C) -->
  <div class="clientes-container">
    <span class="etiqueta-control">#C</span>
    <mat-form-field
      appearance="outline"
      subscriptSizing="dynamic"
      class="input-compacto campo-clientes"
    >
      <mat-select [(ngModel)]="minClientes" (selectionChange)="ejecutarConsulta()">
        <mat-option [value]="0">0</mat-option>
        <mat-option [value]="1">1</mat-option>
        <mat-option [value]="2">2</mat-option>
        <mat-option [value]="5">5</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- 4. Multi-toggle Tipo (G, P, R, S) -->
  <mat-button-toggle-group
    multiple
    [(ngModel)]="tiposSeleccionados"
    (change)="ejecutarConsulta()"
    class="toggle-grupo toggle-tipo"
    aria-label="Filtro Tipo"
  >
    <mat-button-toggle value="G">G</mat-button-toggle>
    <mat-button-toggle value="P">P</mat-button-toggle>
    <mat-button-toggle value="R">R</mat-button-toggle>
    <mat-button-toggle value="S">S</mat-button-toggle>
  </mat-button-toggle-group>

  <!-- 5. Multi-toggle Situación (#, A, C, D, I) -->
  <mat-button-toggle-group
    multiple
    [(ngModel)]="situacionesSeleccionadas"
    (change)="ejecutarConsulta()"
    class="toggle-grupo toggle-situacion"
    aria-label="Filtro Situación"
  >
    <mat-button-toggle value="#">#</mat-button-toggle>
    <mat-button-toggle value="A">A</mat-button-toggle>
    <mat-button-toggle value="C">C</mat-button-toggle>
    <mat-button-toggle value="D">D</mat-button-toggle>
    <mat-button-toggle value="I">I</mat-button-toggle>
  </mat-button-toggle-group>

  <!-- 6. Botones de Acción (Lupa, Diskette, Exportar Excel e Importar Excel) -->
  <div class="acciones-container">
    <button mat-icon-button class="btn-lupa" (click)="ejecutarConsulta()" matTooltip="Consultar (Lupa)">
      <mat-icon>search</mat-icon>
    </button>
    <button mat-icon-button class="btn-guardar" (click)="ejecutarGuardar()" matTooltip="Guardar unificaciones (Diskette)">
      <mat-icon>save</mat-icon>
    </button>
    
    <span class="separador-acciones"></span>

    <button mat-icon-button class="btn-exportar" (click)="ejecutarExportar()" matTooltip="Exportar productos filtrados a Excel">
      <mat-icon>file_download</mat-icon>
    </button>
    <button mat-icon-button class="btn-importar" (click)="fileInput.click()" matTooltip="Importar modificaciones masivas desde Excel">
      <mat-icon>file_upload</mat-icon>
    </button>
    <input #fileInput type="file" (change)="onFileChange($event)" accept=".xlsx, .xls, .csv" style="display: none;" />
  </div>
</div>
